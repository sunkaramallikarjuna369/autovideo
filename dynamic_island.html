<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Island - AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        /* Dynamic Island Container */
        .dynamic-island {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }

        /* Island Base (Pill Shape) */
        .island {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 12px 24px;
            min-width: 60px;
            height: 37px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .island.expanded {
            width: 320px;
            height: auto;
            border-radius: 30px;
            padding: 16px;
        }

        /* Content */
        .island-content {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: white;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .island.expanded .island-content {
            flex-direction: column;
            align-items: flex-start;
        }

        /* Indicator Dot */
        .indicator {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Text */
        .island-text {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .island.expanded .island-text {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
        }

        /* Expanded Content */
        .expanded-content {
            display: none;
            width: 100%;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .island.expanded .expanded-content {
            display: block;
            opacity: 1;
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .input-area input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Send Button */
        .send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Response Area */
        .response-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 150px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.9);
        }

        .response-area.loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Demo Section */
        .demo-section {
            margin-top: 80px;
            text-align: center;
            color: white;
        }

        .demo-section h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .demo-section p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .demo-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .demo-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .demo-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Scrollbar */
        .response-area::-webkit-scrollbar {
            width: 4px;
        }

        .response-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .response-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .response-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Animations */
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .island {
            animation: slideDown 0.4s ease-out;
        }
    </style>
</head>
<body>
    <!-- Dynamic Island -->
    <div class="dynamic-island">
        <div class="island" id="island">
            <div class="island-content">
                <div class="indicator"></div>
                <span class="island-text" id="islandText">JARVIS AI</span>
            </div>
            <div class="expanded-content">
                <div class="input-area">
                    <input
                        type="text"
                        id="userInput"
                        placeholder="Ask me anything..."
                        autocomplete="off"
                    >
                    <button class="send-btn" id="sendBtn">Send</button>
                </div>
                <div class="response-area" id="responseArea"></div>
            </div>
        </div>
    </div>

    <!-- Demo Section -->
    <div class="demo-section">
        <h1>🤖 Dynamic Island AI</h1>
        <p>Click the island at the top to expand • Powered by OpenRouter API</p>
        <div class="demo-buttons">
            <button class="demo-btn" onclick="sendMessage('What is AI?')">Ask about AI</button>
            <button class="demo-btn" onclick="sendMessage('Tell me a joke')">Tell a joke</button>
            <button class="demo-btn" onclick="sendMessage('Hello!')">Say hello</button>
            <button class="demo-btn" onclick="sendMessage('Help me code')">Code help</button>
        </div>
    </div>

    <script>
        const island = document.getElementById('island');
        const islandText = document.getElementById('islandText');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const responseArea = document.getElementById('responseArea');

        let isExpanded = false;

        // Toggle expand/collapse
        island.addEventListener('click', (e) => {
            if (!isExpanded && !e.target.closest('.expanded-content')) {
                expand();
            }
        });

        function expand() {
            isExpanded = true;
            island.classList.add('expanded');
            userInput.focus();
        }

        function collapse() {
            isExpanded = false;
            island.classList.remove('expanded');
            userInput.value = '';
        }

        // Send message
        sendBtn.addEventListener('click', () => sendMessage(userInput.value));
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(userInput.value);
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') collapse();
        });

        async function sendMessage(message) {
            if (!message.trim()) return;

            userInput.value = '';
            responseArea.innerHTML = '';
            responseArea.classList.add('loading');
            sendBtn.disabled = true;

            try {
                // Using OpenRouter API
                const apiKey = prompt('Enter your OpenRouter API key:\n(Get it from https://openrouter.ai)');
                if (!apiKey) return;

                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'Dynamic Island AI'
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',  // or any model from OpenRouter
                        messages: [
                            {
                                role: 'user',
                                content: message
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 150
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const result = data.choices[0].message.content;
                responseArea.classList.remove('loading');
                responseArea.innerHTML = `<strong>🤖 JARVIS:</strong> ${escapeHtml(result)}`;
                islandText.textContent = result.substring(0, 30) + '...';

            } catch (error) {
                responseArea.classList.remove('loading');
                responseArea.innerHTML = `<strong>⚠️ Error:</strong> ${error.message}`;
            } finally {
                sendBtn.disabled = false;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Demo without API
        function demoMode(message) {
            responseArea.innerHTML = '';
            responseArea.classList.add('loading');

            setTimeout(() => {
                responseArea.classList.remove('loading');
                const responses = {
                    'AI': 'Artificial Intelligence is the simulation of human intelligence processes by computer systems.',
                    'joke': 'Why did the AI go to school? To improve its learning model! 😄',
                    'hello': 'Hello! How can I assist you today?',
                    'code': 'I can help with any programming language. What would you like to code?'
                };

                let key = Object.keys(responses).find(k => message.toLowerCase().includes(k));
                let reply = responses[key] || 'This is a demo. Connect your OpenRouter API key for real responses!';

                responseArea.innerHTML = `<strong>🤖 JARVIS:</strong> ${reply}`;
                islandText.textContent = reply.substring(0, 30) + '...';
            }, 800);
        }

        // Override sendMessage for demo
        const originalSendMessage = window.sendMessage;
        window.sendMessage = function(message) {
            if (!message.trim()) return;
            userInput.value = '';
            demoMode(message);
        };
    </script>
</body>
</html>
